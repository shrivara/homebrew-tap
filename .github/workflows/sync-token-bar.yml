name: Sync token-bar

# Keep the formula in step with token-bar releases and start the bottle build.
# The schedule is a fallback for a missed immediate dispatch from token-bar.
on:
  schedule:
    - cron: "47 09 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-token-bar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Sync formula and start bottles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(
            git ls-remote --tags --refs https://github.com/shrivara/token-bar.git |
              sed -nE 's#.*refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$#\1#p' |
              sort -V |
              tail -1
          )
          test -n "$latest"
          current=$(sed -nE 's#.*refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)\.tar\.gz.*#\1#p' Formula/token-bar.rb)

          if [[ "$latest" == "$current" ]] &&
             grep -q "bottles-token-bar-${latest}" Formula/token-bar.rb; then
            echo "Formula and bottles already use token-bar $latest."
            exit 0
          fi

          if [[ "$latest" != "$current" ]]; then
            archive=$(mktemp)
            trap 'rm -f "$archive"' EXIT
            curl --fail --location --silent --show-error --retry 3 \
              "https://github.com/shrivara/token-bar/archive/refs/tags/v${latest}.tar.gz" \
              -o "$archive"
            sha=$(sha256sum "$archive" | cut -d' ' -f1)

            VERSION="$latest" SHA="$sha" python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Formula/token-bar.rb")
          text = path.read_text()
          text, urls = re.subn(
              r'  url "https://github\.com/shrivara/token-bar/archive/refs/tags/v[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz"',
              f'  url "https://github.com/shrivara/token-bar/archive/refs/tags/v{os.environ["VERSION"]}.tar.gz"',
              text,
          )
          text, shas = re.subn(r'  sha256 "[0-9a-f]{64}"', f'  sha256 "{os.environ["SHA"]}"', text, count=1)
          text = re.sub(r'\n  bottle do\n.*?\n  end\n', '', text, count=1, flags=re.DOTALL)
          if urls != 1 or shas != 1:
              raise SystemExit(f"Unexpected formula structure (urls={urls}, shas={shas})")
          path.write_text(text)
          PY

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Formula/token-bar.rb
            git commit -m "token-bar ${latest}"
            git push origin HEAD:main
            echo "### Updated token-bar to ${latest}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Formula uses token-bar $latest but its bottles are missing; retrying them."
          fi

          gh workflow run bottle.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f version="$latest"
          echo "Started bottle build for token-bar ${latest}." >> "$GITHUB_STEP_SUMMARY"
